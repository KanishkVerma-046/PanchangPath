<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
  }
  body {
    background: linear-gradient(135deg, #FFFBF3 0%, #FBE4D2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .card {
    text-align: center;
  }
  .symbol {
    font-size: 120px;
    line-height: 1;
    margin-bottom: 24px;
  }
  .wordmark {
    font-size: 72px;
    font-weight: 700;
    color: #2B1608;
    letter-spacing: -1px;
  }
  .rule {
    width: 160px;
    height: 4px;
    background: #C8922A;
    margin: 28px auto;
    border-radius: 2px;
  }
  .tagline {
    font-size: 28px;
    color: #B5390A;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="symbol">🕉️</div>
    <div class="wordmark">PanchangPath</div>
    <div class="rule"></div>
    <div class="tagline">Hindu Panchang for Any Date &amp; Location</div>
  </div>
</body>
</html>
