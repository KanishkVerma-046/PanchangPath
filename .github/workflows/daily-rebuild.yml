name: Daily rebuild + deploy

# Systemic fix for build-time-content staleness on a static site with otherwise
# manual/on-demand deploys (rashifal's daily prediction, the planetary-events feed,
# and the muhurta hub duplicate were all separate symptoms of the same root cause:
# content computed from `new Date()` at build time doesn't refresh without a new
# build). Rebuilding once a day, shortly after IST midnight, bounds every such
# staleness window to at most ~24h -- and to a few minutes right around IST
# midnight for content that's specifically date-sensitive, like rashifal's Daily
# prediction. A fresh `actions/checkout` is always a clean working tree, so the
# existing `predeploy` clean-tree gate (scripts/check-clean-tree.mjs) is satisfied
# trivially here -- it stays meaningful as a safety net for manual/local deploys.
#
# Requires a CLOUDFLARE_API_TOKEN repo secret (Cloudflare dashboard -> My Profile ->
# API Tokens -> Create Token -> "Edit Cloudflare Workers" template, or a custom token
# scoped to Cloudflare Pages:Edit for this account) and a CLOUDFLARE_ACCOUNT_ID repo
# secret (visible via `npx wrangler whoami`). Both added 2026-08-17.

on:
  schedule:
    # 18:47 UTC = 00:17 IST -- shortly after India's midnight, off the :00/:30 mark.
    - cron: '47 18 * * *'
  workflow_dispatch: {} # allows a manual test run from the Actions tab or `gh workflow run`

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (not the default shallow fetch-depth: 1) -- the
          # `postdeploy` step below (scripts/indexnow-deploy-diff.mjs) needs to
          # `git diff` against whatever commit was live before this run, which
          # a 1-commit-deep clone wouldn't contain. Repo is small (~40MB,
          # ~500 commits as of 2026-09), so a full clone is cheap.
          fetch-depth: 0
        # No explicit ref: defaults to the repo's default branch (master), which is what
        # actually drives production via manual `npm run deploy`. A prior version pinned
        # this to a feature branch (chore/permission-allowlist) that fell 2 commits behind
        # master and would have silently redeployed stale content once auth was fixed.

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # GitHub often starts this scheduled run hours late, and anywhere between 00:00 and
      # 05:30 IST the UTC date is still the previous day. Every build-time "today" goes
      # through src/lib/ist-date.ts, so the start time no longer matters -- this line records
      # the date the build actually used, read through that same helper.
      - name: Log build date (IST)
        run: >-
          node --experimental-strip-types -e "import('./src/lib/ist-date.ts').then(m =>
          console.log('Build date (IST): ' + m.istTodayISO() + ' | started ' + new Date().toISOString()))"

      - run: npm run deploy
        # `npm run deploy`'s `postdeploy` lifecycle step
        # (scripts/indexnow-deploy-diff.mjs) automatically submits only the
        # URLs that actually changed since the last deployment to IndexNow --
        # see docs/superpowers/plans/2026-09-11-indexnow-diff-based-submission.md.
        # This replaced an unconditional full-sitemap submission that ran here
        # every day regardless of whether anything changed, which Bing
        # Webmaster Tools flagged as "IndexNow is in batch mode". A much
        # smaller, explicitly-rare full-sitemap fallback still runs weekly --
        # see .github/workflows/weekly-indexnow-safety-net.yml.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
